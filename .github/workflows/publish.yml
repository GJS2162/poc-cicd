name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v1.2.3)"
        required: true

jobs:
  publish:
    permissions:
      id-token: write  # Required for OIDC authentication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensure all tags are available

      - name: Checkout specified tag
        run: |
          TAG=${{ github.event.inputs.tag }}

          # Validate the tag format
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid tag format. Expected format: vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi

          # Check if the tag exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Checking out tag: $TAG"
            git checkout "$TAG"
          else
            echo "Error: Tag $TAG does not exist!"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0  # Use a specific stable version

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Extract Version from pubspec.yaml
        run: |
          PKG_VERSION=$(yq '.version' pubspec.yaml | tr -d '"')
          if [[ -z "$PKG_VERSION" || ! "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Error: Invalid or missing version in pubspec.yaml" >&2
            exit 1
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
      
      - name: Validate version in CHANGELOG
        run: |
          PUBSPEC_VERSION=$(yq '.version' pubspec.yaml | tr -d '"')
          CHANGELOG_VERSION=$(grep -oP '(?<=^## )\d+\.\d+\.\d+' CHANGELOG.md | head -1)
      
          if [[ "$PUBSPEC_VERSION" != "$CHANGELOG_VERSION" ]]; then
            echo "Error: Version mismatch! pubspec.yaml ($PUBSPEC_VERSION) ≠ CHANGELOG.md ($CHANGELOG_VERSION)"
            exit 1
          fi
        
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify Dart setup
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Dry run (test before publishing)
        run: dart pub publish --dry-run

      - name: Publish package
        run: dart pub publish --force
