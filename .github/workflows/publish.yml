name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g., v1.2.3)"
        required: true

jobs:
  publish:
    permissions:
      id-token: write  # Required for OIDC authentication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: dev  # Ensure we check out the dev branch

      - name: Ensure the latest dev branch is checked out
        run: |
          git fetch origin dev
          git checkout dev
          git pull origin dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0  # Use a specific stable version

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Extract Version from pubspec.yaml
        run: |
          PKG_VERSION=$(yq '.version' pubspec.yaml | tr -d '"')
          if [[ -z "$PKG_VERSION" || ! "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid or missing version in pubspec.yaml" >&2
            exit 1
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV

      - name: Validate version in CHANGELOG
        run: |
          PUBSPEC_VERSION=$(yq '.version' pubspec.yaml | tr -d '"')
          CHANGELOG_VERSION=$(grep -oP '(?<=^## )\d+\.\d+\.\d+' CHANGELOG.md | head -1)
      
          if [[ "$PUBSPEC_VERSION" != "$CHANGELOG_VERSION" ]]; then
            echo "Error: Version mismatch! pubspec.yaml ($PUBSPEC_VERSION) ≠ CHANGELOG.md ($CHANGELOG_VERSION)"
            exit 1
          fi

      - name: Validate provided tag matches package version
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          EXPECTED_TAG="v$PKG_VERSION"

          if [[ "$INPUT_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Error: Provided tag ($INPUT_TAG) does not match package version ($EXPECTED_TAG)!"
            exit 1
          fi

      - name: Check if tag already exists
        run: |
          git fetch --tags
          if git rev-parse "refs/tags/${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            echo "Error: Tag ${{ github.event.inputs.tag }} already exists!"
            exit 1
          fi

      - name: Configure Git Credentials
        run: |
          git config --global user.name "GJS2162"
          git config --global user.email "gaurav2125cse@gmail.com"
          git remote set-url origin "https://${{ secrets.GH_PAT }}@github.com/GJS2162/poc-cicd.git"

      - name: Create and push tag from dev branch
        run: |
          git tag ${{ github.event.inputs.tag }}
          git push origin ${{ github.event.inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
  

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify Dart setup
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Dry run (test before publishing)
        run: dart pub publish --dry-run

      - name: Publish package
        run: dart pub publish --force
