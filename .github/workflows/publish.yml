name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v1.2.3)"
        required: true

jobs:
  publish:
    permissions:
      id-token: write  # Required for OIDC authentication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Checkout specified tag
        run: |
          TAG=${{ github.event.inputs.tag }}

          # Validate tag format (vX.Y.Z)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid tag format. Use vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi

          # Check if tag exists
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Checking out tag: $TAG"
            git checkout "refs/tags/$TAG"
          else
            echo "Error: Tag $TAG does not exist!"
            exit 1
          fi

          # Set environment variables for tag publishing
          echo "GITHUB_REF=refs/tags/$TAG" >> $GITHUB_ENV
          echo "GITHUB_REF_TYPE=tag" >> $GITHUB_ENV

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Dry run (test before publishing)
        run: dart pub publish --dry-run

      - name: Publish package
        run: dart pub publish --force
