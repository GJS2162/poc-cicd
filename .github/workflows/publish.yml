name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g., v1.2.3)"
        required: true

jobs:
  publish:
    permissions:
      id-token: write  # Required for OIDC authentication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch all tags and checkout selected tag
        run: |
          git fetch --tags
          git checkout ${{ github.event.inputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0  # Use a specific stable version

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Extract Package Name and Version
        run: |
          PACKAGE_NAME=$(yq '.name' pubspec.yaml | tr -d '"')
          PKG_VERSION=$(yq '.version' pubspec.yaml | tr -d '"')
          
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV

      - name: Check if version is already published
        run: |
          if curl --silent --fail "https://pub.dev/packages/$PACKAGE_NAME/versions/$PKG_VERSION" >/dev/null; then
            echo "Error: Version $PKG_VERSION of package $PACKAGE_NAME is already published on pub.dev!"
            exit 1
          fi

      - name: Validate version in CHANGELOG
        run: |
          PUBSPEC_VERSION=$(yq '.version' pubspec.yaml | tr -d '"')
          CHANGELOG_VERSION=$(grep -oP '(?<=^## )\d+\.\d+\.\d+' CHANGELOG.md | head -1)
      
          if [[ "$PUBSPEC_VERSION" != "$CHANGELOG_VERSION" ]]; then
            echo "Error: Version mismatch! pubspec.yaml ($PUBSPEC_VERSION) ≠ CHANGELOG.md ($CHANGELOG_VERSION)"
            exit 1
          fi

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify Dart setup
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Dry run (test before publishing)
        run: dart pub publish --dry-run

      - name: Publish package
        run: dart pub publish --force
